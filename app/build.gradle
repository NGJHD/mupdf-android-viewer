apply plugin: 'com.android.application'

group = 'com.artifex.mupdf'
version = '2.0.0'

dependencies {
	if (file('../lib/build.gradle').isFile())
		api project(':lib')
	else
		api 'com.artifex.mupdf:viewer:1.28.3a'
}

android {
	namespace 'com.artifex.mupdf.viewer.app'
	compileSdkVersion 33
	defaultConfig {
		/* Our own id, not the com.artifex.mupdf.viewer.app that namespace
		 * would give us: sharing Artifex's id made Google Play offer the
		 * upstream viewer as an update to this fork. */
		applicationId 'io.github.ngjhd.mupdf'
		minSdkVersion 21
		targetSdkVersion 36
		versionName '2.0.0'
		versionCode 251
	}

	splits {
		abi {
			enable true
			/* Only build the arm64-v8a APK. That is the ABI of every modern
			 * Android phone, and it is the only artifact we publish on the
			 * GitHub releases page. Building the other splits (or the
			 * universal APK) just wastes time and clutters the release. */
			reset()
			include 'arm64-v8a'
			universalApk false
		}
	}

	bundle {
		abi {
			enableSplit true
		}
	}

	if (project.hasProperty('release_storeFile')) {
		signingConfigs {
			release {
				storeFile file(release_storeFile)
				storePassword release_storePassword
				keyAlias release_keyAlias
				keyPassword release_keyPassword
			}
		}
		buildTypes {
			release {
				signingConfig signingConfigs.release
				ndk {
					debugSymbolLevel 'FULL'
				}
			}
		}
	}
}
