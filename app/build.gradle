apply plugin: 'com.android.application'

group = 'com.artifex.mupdf'
version = '1.28.3a'

dependencies {
	if (file('../lib/build.gradle').isFile())
		api project(':lib')
	else
		api 'com.artifex.mupdf:viewer:1.28.3a'
}

android {
	namespace 'com.artifex.mupdf.viewer.app'
	compileSdkVersion 33
	defaultConfig {
		minSdkVersion 21
		targetSdkVersion 36
		versionName '1.28.3a'
		versionCode 250
	}

	splits {
		abi {
			enable true
			/* Only split on the ABIs the fitz native library actually ships.
			 * Without this we also emit armeabi/mips/mips64/riscv64 APKs that
			 * contain no libmupdf_java.so and crash as soon as a document is
			 * opened. */
			reset()
			include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
			universalApk true
		}
	}

	bundle {
		abi {
			enableSplit true
		}
	}

	if (project.hasProperty('release_storeFile')) {
		signingConfigs {
			release {
				storeFile file(release_storeFile)
				storePassword release_storePassword
				keyAlias release_keyAlias
				keyPassword release_keyPassword
			}
		}
		buildTypes {
			release {
				signingConfig signingConfigs.release
				ndk {
					debugSymbolLevel 'FULL'
				}
			}
		}
	}
}
