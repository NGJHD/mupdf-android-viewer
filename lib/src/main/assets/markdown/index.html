<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Markdown can carry raw HTML, so lock the page down: only our own bundled
     scripts run, nothing is fetched from the network, and images come only
     from the document folder (served by the app) or data: URIs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'">
<link rel="stylesheet" href="vendor/katex.min.css">
<link id="hljs-light" rel="stylesheet" href="vendor/hljs-light.min.css">
<link id="hljs-dark" rel="stylesheet" href="vendor/hljs-dark.min.css">
<link rel="stylesheet" href="reader.css">

<script src="vendor/markdown-it-footnote.min.js"></script>

<script src="vendor/markdown-it-deflist.min.js"></script>
<script src="vendor/markdown-it-emoji.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/texmath.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/purify.min.js"></script>
</head>

<main id="content"></main>

</html>
